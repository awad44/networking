<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="title desc"><title id="title">Bus</title><desc id="desc">Devices share one long backbone cable, using short drop connections.</desc><style>text{font:13px Arial,sans-serif;fill:#173c2c;text-anchor:middle}line,path{stroke:#769588;stroke-width:3;fill:none}.device rect{fill:#fff;stroke:#527562;stroke-width:2}.controller rect{fill:#c6ed86;stroke:#345d43;stroke-width:2}.key{font-size:11px;fill:#52685b}</style><rect width="420" height="280" rx="16" fill="#edf2e8"/><line x1="40" y1="145" x2="380" y2="145"/><line x1="40" y1="131" x2="40" y2="159"/><line x1="380" y1="131" x2="380" y2="159"/><line x1="85" y1="145" x2="85" y2="90"/><g class="device"><rect x="62" y="57" width="46" height="36" rx="9"/><text x="85" y="80">A</text></g><line x1="165" y1="145" x2="165" y2="90"/><g class="device"><rect x="142" y="57" width="46" height="36" rx="9"/><text x="165" y="80">B</text></g><line x1="245" y1="145" x2="245" y2="90"/><g class="device"><rect x="222" y="57" width="46" height="36" rx="9"/><text x="245" y="80">C</text></g><line x1="325" y1="145" x2="325" y2="90"/><g class="device"><rect x="302" y="57" width="46" height="36" rx="9"/><text x="325" y="80">D</text></g><text x="210" y="193">Shared backbone cable</text><text x="210" y="266" class="key">Lines = physical links · boxes = devices</text></svg>