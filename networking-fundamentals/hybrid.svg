<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="title desc"><title id="title">Hybrid</title><desc id="desc">A network combines topology types instead of using only one.</desc><style>text{font:13px Arial,sans-serif;fill:#173c2c;text-anchor:middle}line,path{stroke:#769588;stroke-width:3;fill:none}.device rect{fill:#fff;stroke:#527562;stroke-width:2}.controller rect{fill:#c6ed86;stroke:#345d43;stroke-width:2}.key{font-size:11px;fill:#52685b}</style><rect width="420" height="280" rx="16" fill="#edf2e8"/><line x1="210" y1="65" x2="95" y2="160"/><line x1="37" y1="160" x2="153" y2="160"/><line x1="55" y1="160" x2="55" y2="210"/><g class="device"><rect x="32" y="203" width="46" height="36" rx="9"/><text x="55" y="226">A</text></g><line x1="135" y1="160" x2="135" y2="210"/><g class="device"><rect x="112" y="203" width="46" height="36" rx="9"/><text x="135" y="226">B</text></g><line x1="210" y1="65" x2="325" y2="160"/><line x1="267" y1="160" x2="383" y2="160"/><line x1="285" y1="160" x2="285" y2="210"/><g class="device"><rect x="262" y="203" width="46" height="36" rx="9"/><text x="285" y="226">C</text></g><line x1="365" y1="160" x2="365" y2="210"/><g class="device"><rect x="342" y="203" width="46" height="36" rx="9"/><text x="365" y="226">D</text></g><g class="controller"><rect x="172" y="43" width="76" height="44" rx="12"/><text x="210" y="70">Switch</text></g><text x="95" y="140">Bus branch</text><text x="325" y="140">Bus branch</text><text x="210" y="266" class="key">Lines = physical links · boxes = devices</text></svg>